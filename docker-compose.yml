version: '3.8'

services:
  sigma-cb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigma_cb_bombeiros
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Volume persistente para o banco de dados open-source
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
