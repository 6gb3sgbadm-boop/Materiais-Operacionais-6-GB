name: CI/CD Pipeline - SIGMA-CB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Testes, Lint e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Validação de Tipos e Lint
        run: npm run lint

      - name: Compilação de Produção (Vite Build)
        run: npm run build

      - name: Teste de Inicialização e Healthcheck
        run: |
          npm run start &
          SERVER_PID=$!
          echo "Aguardando inicialização do servidor..."
          sleep 5
          curl -f http://localhost:3000/api/health || exit 1
          kill $SERVER_PID

  docker-build:
    name: Build do Container Docker
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sigmacb:latest
